name: SettingsNavigationTests
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  SettingsNavigationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SettingsNavigationUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.settings-navigation-tests
schemes:
  SettingsNavigation:
    build:
      targets:
        SettingsNavigationUITests: [test]
    test:
      targets: [SettingsNavigationUITests]
