name: SidebarSeparatorsTests
options:
  deploymentTarget: {iOS: '18.1'}
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  SidebarSeparatorsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SidebarSeparatorsUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.sidebar-separators-tests
schemes:
  SidebarSeparators:
    build:
      targets:
        SidebarSeparatorsUITests: [test]
    test:
      targets: [SidebarSeparatorsUITests]
