name: SidebarQA
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  SidebarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: SidebarUITests.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.sidebar-ui-tests
schemes:
  UI:
    build:
      targets:
        SidebarUITests: [test]
    test:
      targets: [SidebarUITests]
