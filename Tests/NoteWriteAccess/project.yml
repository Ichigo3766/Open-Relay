name: NoteWriteAccess
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  NoteWriteAccessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NoteWriteAccessUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.note-write-tests
schemes:
  NoteWriteAccess:
    build:
      targets:
        NoteWriteAccessUITests: [test]
    test:
      targets: [NoteWriteAccessUITests]
