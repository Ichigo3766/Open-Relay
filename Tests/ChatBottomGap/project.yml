name: SpacingTests
options:
  deploymentTarget: {iOS: '18.1'}
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  SpacingTestHost:
    type: application
    platform: iOS
    sources: Host.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.spacing-host
  SpacingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: SpacingUITests.swift
    dependencies: [{target: SpacingTestHost}]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.spacing-tests
      TEST_TARGET_NAME: SpacingTestHost
schemes:
  SpacingTests:
    build:
      targets:
        SpacingTestHost: all
        SpacingUITests: [test]
    test:
      targets: [SpacingUITests]
