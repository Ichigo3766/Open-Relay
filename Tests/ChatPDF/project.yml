name: ChatPDF
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  PDFUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PDFUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.pdf-tests
schemes:
  ChatPDF:
    build:
      targets:
        PDFUITests: [test]
    test:
      targets: [PDFUITests]
