name: ReadAloudPrefetch
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGNING_REQUIRED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  SpeechTestHost:
    type: application
    platform: iOS
    sources:
      - Host.swift
      - '../../Open UI/Core/Services/ReadAloudPlayer.swift'
      - '../../Open UI/Core/Services/TTSTextPreprocessor.swift'
      - '../../Open UI/Core/Models/SpeechSplitting.swift'
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.prefetch-host
      INFOPLIST_KEY_UIBackgroundModes: audio
  PlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlayerTests.swift, PrefetchTests.swift]
    dependencies:
      - target: SpeechTestHost
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.prefetch-tests
      TEST_HOST: '$(BUILT_PRODUCTS_DIR)/SpeechTestHost.app/SpeechTestHost'
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AppUITests.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.prefetch-ui-tests
schemes:
  ReadAloudPrefetch:
    build:
      targets:
        SpeechTestHost: all
        PlayerTests: [test]
    test:
      targets: [PlayerTests]
  AppPrefetch:
    build:
      targets:
        AppUITests: [test]
    test:
      targets: [AppUITests]
