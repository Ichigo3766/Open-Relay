name: AttachmentsTests
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  AttachmentsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AttachmentsUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.attachments-tests
schemes:
  Attachments:
    build:
      targets:
        AttachmentsUITests: [test]
    test:
      targets: [AttachmentsUITests]
      testPlans:
        - path: Attachments.xctestplan
          defaultPlan: true
