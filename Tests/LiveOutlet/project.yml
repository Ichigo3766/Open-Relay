name: LiveOutlet
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  OutletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OutletUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.outlet-tests
schemes:
  LiveOutlet:
    build:
      targets:
        OutletUITests: [test]
    test:
      targets: [OutletUITests]
