name: ToolbarConsistency
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  ToolbarConsistencyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ToolbarConsistencyUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.toolbar-tests
schemes:
  ToolbarConsistency:
    build:
      targets:
        ToolbarConsistencyUITests: [test]
    test:
      targets: [ToolbarConsistencyUITests]
