name: SidebarHeaderTests
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  SidebarHeaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SidebarHeaderUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.sidebar-header-tests
schemes:
  SidebarHeader:
    build:
      targets:
        SidebarHeaderUITests: [test]
    test:
      targets: [SidebarHeaderUITests]
