name: TerminalFilesTests
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  TerminalFilesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TerminalFilesUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.terminal-files-tests
schemes:
  TerminalFiles:
    build:
      targets:
        TerminalFilesUITests: [test]
    test:
      targets: [TerminalFilesUITests]
