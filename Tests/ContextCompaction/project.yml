name: ContextCompaction
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  ContextUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ContextUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.context-tests
schemes:
  ContextCompaction:
    build:
      targets:
        ContextUITests: [test]
    test:
      targets: [ContextUITests]
