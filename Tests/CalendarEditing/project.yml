name: CalendarEditing
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  CalendarEditingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CalendarEditingUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.calendar-editing-tests
schemes:
  CalendarEditing:
    build:
      targets:
        CalendarEditingUITests: [test]
    test:
      targets: [CalendarEditingUITests]
