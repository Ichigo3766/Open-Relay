name: NoteDrafts
options:
  deploymentTarget:
    iOS: '18.1'
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  NoteDraftsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NoteDraftsUITests.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.note-drafts-tests
schemes:
  NoteDrafts:
    build:
      targets:
        NoteDraftsUITests: [test]
    test:
      targets: [NoteDraftsUITests]
